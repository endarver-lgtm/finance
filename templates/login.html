<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1013">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AkselMoney">
  <meta name="application-name" content="AkselMoney">
  <meta name="format-detection" content="telephone=no">
  <title>Вход — AkselMoney</title>
  
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}?v=5">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}?v=5">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}?v=5">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f1013;
      --card-bg: #18191e;
      --text-main: #f0f1f5;
      --text-muted: #8b8e9b;
      --accent: #1b5e3f;
      --accent-hover: #237851;
      --accent-glow: rgba(27, 94, 63, 0.4);
      --key-bg: #1a1c23;
      --key-hover: #252833;
      --key-active: #2f3442;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #f87171;
      --border-color: #262933;
      --border-focus: rgba(27, 94, 63, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .error-banner {
      background: var(--error-bg);
      color: var(--error-text);
      font-size: 13px;
      font-weight: 500;
      padding: 11px 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(239, 68, 68, 0.25);
      line-height: 1.4;
      text-align: center;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .auth-input {
      width: 100%;
      height: 52px;
      padding: 0 46px 0 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 16px;
      font-family: 'Inter', -apple-system, sans-serif;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .auth-input:focus {
      border-color: #2a8555;
      box-shadow: 0 0 0 3px rgba(42, 133, 85, 0.25);
    }

    .auth-input::placeholder {
      color: #646877;
      font-size: 14.5px;
    }

    .btn-toggle-eye {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .btn-toggle-eye:hover {
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background: #1b5e3f;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s, transform 0.08s;
      box-shadow: 0 2px 8px rgba(27, 94, 63, 0.3);
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .keypad-toggle-btn {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12.5px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 6px;
      align-self: center;
    }

    .keypad-toggle-btn:hover {
      color: var(--text-main);
    }

    /* Optional numeric keypad block */
    .keypad-drawer {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .keypad-drawer.hidden {
      display: none;
    }

    .key {
      height: 52px;
      background: var(--key-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: background 0.12s, transform 0.08s;
    }

    .key:hover {
      background: var(--key-hover);
    }

    .key:active {
      background: var(--key-active);
      transform: scale(0.95);
    }

    .key-action {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
    }

    .key-action:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .security-notice {
      margin-top: 28px;
      font-size: 11.5px;
      color: #636675;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="app-brand">
      <div class="brand-logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}?v=5" alt="AkselMoney">
      </div>
      <h1 class="brand-title">AkselMoney</h1>
      <p class="brand-subtitle">Персональный финансовый движок</p>
    </div>

    {% if error %}
    <div class="error-banner" id="error-msg">
      {{ error }}
    </div>
    {% endif %}

    <form class="auth-form" method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="input-wrapper">
        <input 
          type="password" 
          name="password" 
          id="password-input" 
          class="auth-input" 
          placeholder="Введите пароль или PIN" 
          autocomplete="current-password" 
          required 
          autofocus
        >
        <button type="button" class="btn-toggle-eye" id="toggle-eye" aria-label="Показать пароль">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn-submit">
        <span>Войти в систему</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>

      <button type="button" class="keypad-toggle-btn" id="toggle-keypad">
        Показать цифровой PIN-пад
      </button>

      <div class="keypad-drawer hidden" id="keypad">
        <button type="button" class="key" data-digit="1">1</button>
        <button type="button" class="key" data-digit="2">2</button>
        <button type="button" class="key" data-digit="3">3</button>
        <button type="button" class="key" data-digit="4">4</button>
        <button type="button" class="key" data-digit="5">5</button>
        <button type="button" class="key" data-digit="6">6</button>
        <button type="button" class="key" data-digit="7">7</button>
        <button type="button" class="key" data-digit="8">8</button>
        <button type="button" class="key" data-digit="9">9</button>
        <button type="button" class="key key-action" id="btn-clear" aria-label="Очистить">C</button>
        <button type="button" class="key" data-digit="0">0</button>
        <button type="button" class="key key-action" id="btn-backspace" aria-label="Удалить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>
    </form>

    <div class="security-notice">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>PBKDF2-SHA256 (600k) &bull; Защита от перебора</span>
    </div>
  </div>

  <script>
    (function() {
      const input = document.getElementById('password-input');
      const toggleEye = document.getElementById('toggle-eye');
      const toggleKeypad = document.getElementById('toggle-keypad');
      const keypad = document.getElementById('keypad');
      const clearBtn = document.getElementById('btn-clear');
      const backspaceBtn = document.getElementById('btn-backspace');

      // Toggle password visibility
      if (toggleEye && input) {
        toggleEye.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          toggleEye.innerHTML = isPassword
            ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/></svg>'
            : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
        });
      }

      // Toggle numeric keypad drawer
      if (toggleKeypad && keypad) {
        toggleKeypad.addEventListener('click', () => {
          const isHidden = keypad.classList.contains('hidden');
          if (isHidden) {
            keypad.classList.remove('hidden');
            toggleKeypad.textContent = 'Скрыть цифровой PIN-пад';
          } else {
            keypad.classList.add('hidden');
            toggleKeypad.textContent = 'Показать цифровой PIN-пад';
          }
        });
      }

      // Keypad button handling
      document.querySelectorAll('.key[data-digit]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          input.value += btn.dataset.digit;
          input.focus();
        });
      });

      if (clearBtn) {
        clearBtn.addEventListener('click', (e) => {
          e.preventDefault();
          input.value = '';
          input.focus();
        });
      }

      if (backspaceBtn) {
        backspaceBtn.addEventListener('click', (e) => {
          e.preventDefault();
          input.value = input.value.slice(0, -1);
          input.focus();
        });
      }
    })();
  </script>
</body>
</html>
