{% extends 'base.html' %}

{% block title %}Настройки — Финансы{% endblock %}

{% block content %}
<header class="page-header">
  <h1>Настройки</h1>
</header>

<article class="card settings-card">
  <form method="post">
    <label>Валюта
      <input type="text" name="currency" value="{{ currency }}" maxlength="5" placeholder="€">
    </label>
    <p class="muted">Отображается рядом со всеми суммами в приложении.</p>
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>
</article>
{% endblock %}
