# Render Blueprint — можно задеплоить через "New → Blueprint"
# https://render.com/docs/blueprint-spec
#
# Всё равно нужно вручную:
# 1) Создать проект в Supabase и получить DATABASE_URL
# 2) В Render Dashboard → этот сервис → Environment добавить DATABASE_URL и SECRET_KEY
#    (или задать sync: false и вписать значения в UI)

services:
  - type: web
    name: finance-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_CURRENCY
        value: BYN
